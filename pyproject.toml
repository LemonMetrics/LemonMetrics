[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lemonmetrics"
version = "1.0.0"
description = "Open-source benchmark + energy harness for Lemonade local AI servers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Austin Casteel" },
    { name = "Lemon Metrics contributors" },
]
keywords = ["lemonade", "amd", "benchmark", "llm", "energy", "local-ai", "ryzen-ai", "npu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing :: Benchmark",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
lemonmetrics = "lemonmetrics.cli:main"

[tool.setuptools]
packages = ["lemonmetrics", "lemonmetrics.power"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
